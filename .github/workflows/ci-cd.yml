name: HirePoint CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t hirepoint-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t hirepoint-frontend ./frontend

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        run: docker tag hirepoint-backend aditiyadav30/hirepoint-backend:latest

      - name: Tag frontend image
        run: docker tag hirepoint-frontend aditiyadav30/hirepoint-frontend:latest

      - name: Push backend image
        run: docker push aditiyadav30/hirepoint-backend:latest

      - name: Push frontend image
        run: docker push aditiyadav30/hirepoint-frontend:latest